<!doctype html>
<html lang="cs" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>🦷 Doktor Tkalych — skladový bot · prezentace</title>
<style>
/* ============ base ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1220; --bg2:#0e1728;
  --ink:#e8eef7; --muted:#8fa1bb;
  --blue:#2aabee; --mint:#34d19d; --amber:#ffb454; --red:#ff6b6b;
  --tg-bg:#0e1621; --tg-in:#182533; --tg-out:#2b5278;
  --btn-bg:rgba(116,178,240,.13); --btn-ink:#8fc6f5; --btn-bd:rgba(116,178,240,.22);
  --card:#101b2c; --card-bd:#22314a;
}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 70% -10%, #12203a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
b{font-weight:700}
/* ============ chrome ============ */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:linear-gradient(180deg,rgba(11,18,32,.94),rgba(11,18,32,.72) 80%,transparent);}
.brand{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);flex:0 0 auto}
.chapters{display:flex;gap:5px;flex:1;flex-wrap:wrap;justify-content:center;min-width:0}
.chp{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap}
.chp:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.chp.on{color:#0a1420;background:linear-gradient(135deg,#2aabee,#1d84d4);border-color:transparent}
.tools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.tbtn{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:#cfe0f2;padding:6px 11px;border-radius:9px;
  border:1px solid var(--card-bd);background:rgba(13,21,34,.7)}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.on{color:#0a1420;background:var(--mint);border-color:transparent}
.lang{display:flex;border:1px solid var(--card-bd);border-radius:9px;overflow:hidden}
.lang .tbtn{border:0;border-radius:0}
.lang .tbtn.on{background:var(--blue)}
/* ============ deck ============ */
.deck{position:fixed;inset:0;padding:74px 26px 66px;display:flex;align-items:center;justify-content:center}
.slide{display:none;width:min(1180px,100%);height:100%;align-items:center;justify-content:center;gap:44px}
.slide.on{display:flex}
/* phone */
.ph{flex:0 0 auto;height:100%;display:flex;align-items:center}
.phone{
  position:relative;width:clamp(250px,42vh,340px);aspect-ratio:376/774;
  background:#000;border-radius:44px;padding:9px;
  container-type:inline-size;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 6px 22px rgba(0,0,0,.45),inset 0 0 0 2px #2a3546;
}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--tg-bg);display:flex;flex-direction:column;font-size:min(13.4px,3.75cqw)}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:32%;height:22px;background:#000;border-radius:0 0 14px 14px;z-index:30}
.status{height:32px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 2px;font-size:.86em;font-weight:600;color:#dfe8f2}
.sicons{display:flex;gap:5px;align-items:center}
.bars{display:flex;gap:1.5px;align-items:flex-end}
.bars i{width:3px;background:#dfe8f2;border-radius:1px;display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
.batt{width:20px;height:10px;border:1.5px solid #dfe8f2aa;border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;inset:1.5px;right:5px;background:#dfe8f2;border-radius:1px}
.tg-head{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 12px 9px;background:#17212b;border-bottom:1px solid #0b131b}
.back{color:var(--blue);font-size:1.55em;line-height:1;margin-right:-2px}
.ava{width:2.6em;height:2.6em;border-radius:50%;background:linear-gradient(135deg,#2aabee,#1d7dd4);display:flex;align-items:center;justify-content:center;font-size:1em;flex:0 0 auto}
.tg-title{flex:1;min-width:0}
.tg-title b{display:block;font-size:1.03em}
.tg-title span{display:block;font-size:.84em;color:var(--muted)}
.dots3{color:var(--muted);font-size:1.28em;letter-spacing:1px}
.chat{flex:1;overflow:hidden;padding:10px 9px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;position:relative}
.daychip{align-self:center;background:rgba(0,0,0,.28);color:#aebdcd;font-size:.8em;padding:3px 10px;border-radius:20px;margin:2px 0}
.msg{max-width:88%;border-radius:14px;padding:7px 10px 6px;font-size:.95em;line-height:1.34;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.22)}
.msg.in{align-self:flex-start;background:var(--tg-in);border-bottom-left-radius:5px}
.msg.in:has(.kb){width:88%}
.msg.out{align-self:flex-end;background:var(--tg-out);border-bottom-right-radius:5px}
.msg .t{display:inline-block;float:right;margin:8px -3px -2px 8px;font-size:.76em;color:#7d92a6}
.msg.out .t{color:#9fc3e2}
.msg .t .tick{color:#6fb3e0}
.msg .title{font-weight:700}
.msg .sub{color:#aebdcd;font-size:.93em}
.msg i.sl{font-style:italic;color:#aebdcd}
.msg .ok{color:#62c877}.msg .warn{color:var(--amber)}.msg .bad{color:var(--red)}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:rgba(0,0,0,.25);padding:0 4px;border-radius:4px}
.bq{margin:5px 0 3px;border-left:2.5px solid rgba(143,198,245,.55);padding:3px 8px;background:rgba(143,198,245,.06);border-radius:0 8px 8px 0;font-size:.93em;color:#cfe0f2}
.react{position:absolute;left:8px;bottom:-9px;background:#1d2c3c;border:1px solid #2c3f53;border-radius:20px;font-size:.78em;padding:1px 7px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rows{margin-top:5px;border-left:2.5px solid rgba(143,198,245,.55);padding:2px 0 2px 8px;display:flex;flex-direction:column;gap:2.5px;background:rgba(143,198,245,.05);border-radius:0 8px 8px 0}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.93em}
.row em{font-style:normal;color:#cfe0f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-weight:600;color:#fff;white-space:nowrap}
.row.dim{color:#8fa1bb}.row.dim em{color:#8fa1bb}
.row.low em,.row.low b{color:var(--amber)}
.row.red em,.row.red b{color:var(--red)}
/* inline keyboard */
.kb{display:flex;flex-direction:column;gap:4px;margin-top:6px;width:100%}
.kbrow{display:flex;gap:4px}
.kbtn{
  flex:1;text-align:center;padding:.5em .55em;font-size:.92em;font-weight:500;color:var(--btn-ink);
  background:var(--btn-bg);border:1px solid var(--btn-bd);border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  position:relative;
}
.kbtn.sel{background:rgba(52,209,157,.16);border-color:rgba(52,209,157,.4);color:#7ee0bd}
.kbtn.l{text-align:left}
/* reply keyboard (webapp button) */
.replykb{flex:0 0 auto;background:#17212b;border-top:1px solid #0b131b;padding:7px 10px}
.rbtn{text-align:center;padding:.62em;font-size:.95em;font-weight:600;color:#8fc6f5;background:#242f3d;border-radius:10px;position:relative}
/* input bar */
.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#17212b;padding:8px 12px;border-top:1px solid #0b131b;position:relative}
.inputbar .clip,.inputbar .mic{font-size:1.35em;color:#708499;flex:0 0 auto}
.field{flex:1;min-height:2.4em;display:flex;align-items:center;background:#242f3d;border-radius:18px;padding:0 13px;font-size:1em;color:#e8eef7;overflow:hidden;white-space:nowrap}
.field .ph-t{color:#708499}
.field .typed{color:#e8eef7}
.field .bot-pref{color:#2aabee}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--blue);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* inline results popup */
.inline-pop{position:absolute;left:8px;right:8px;bottom:100%;margin-bottom:6px;background:#1d2939;border:1px solid #2c3f53;border-radius:12px;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.5);z-index:5}
.ipop-row{display:flex;flex-direction:column;padding:7px 12px;border-bottom:1px solid #253346;position:relative}
.ipop-row:last-child{border-bottom:0}
.ipop-row b{font-size:.93em}
.ipop-row span{font-size:.8em;color:var(--muted)}
.ipop-row.spot{outline:none;animation:none;box-shadow:inset 0 0 0 2.5px var(--amber);background:rgba(255,180,84,.07)}
/* scanner (mini app) */
.scanhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;color:#dfe8f2;font-size:.95em;font-weight:600;background:#05080d}
.scanhead .x{color:var(--blue);font-weight:500}
.cam{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(420px 300px at 30% 20%,#1d2836 0%,transparent 60%),
  radial-gradient(380px 320px at 80% 85%,#14202e 0%,transparent 60%),
  linear-gradient(180deg,#0a111c,#070c14)}
.cam .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 44%,transparent 40%,rgba(0,0,0,.5) 100%)}
.prodbox{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-2deg);
  width:70%;background:linear-gradient(160deg,#fdfdfd,#e9edf2);border-radius:8px;padding:11px 12px 10px;
  box-shadow:0 18px 44px rgba(0,0,0,.6);color:#1c2733;
}
.prodbox .pb-brand{font-size:.64em;font-weight:800;letter-spacing:1.6px;color:#1a6fb5}
.prodbox .pb-name{font-size:.95em;font-weight:800;margin:2px 0 0;color:#15202b;line-height:1.15}
.prodbox .pb-sub{font-size:.66em;color:#5c6c7c;margin-bottom:7px}
.pb-codes{display:flex;gap:9px;align-items:center}
.dm{width:34%;aspect-ratio:1;background:
  conic-gradient(#15202b 25%,transparent 0 50%,#15202b 0 75%,transparent 0) 0 0/22% 22%,
  linear-gradient(#15202b,#15202b) left/8% 100% no-repeat,
  linear-gradient(#15202b,#15202b) bottom/100% 8% no-repeat,#f2f2f2;border:3px solid #f2f2f2;outline:1px solid #ccc}
.pb-gs1{flex:1;font-family:ui-monospace,Consolas,monospace;font-size:.55em;color:#334;line-height:1.5;word-break:break-all}
.frame4{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:80%;aspect-ratio:1.12;pointer-events:none}
.frame4 i{position:absolute;width:24px;height:24px;border:3px solid #fff;opacity:.95}
.frame4 i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.frame4 i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.frame4 i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.frame4 i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:12%;right:12%;height:2.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff5f5f 18%,#ff5f5f 82%,transparent);box-shadow:0 0 14px #ff5f5f;top:40%}
.cam-hint{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:.88em;color:#dfe8f2;text-shadow:0 1px 4px #000}
.cam-tools{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
.cam-tool{background:rgba(23,33,43,.85);border:1px solid #2c3f53;color:#dfe8f2;font-size:.82em;font-weight:600;padding:5px 12px;border-radius:18px}
.cam-input{position:absolute;left:10%;right:10%;top:76%;display:flex;background:rgba(23,33,43,.9);border:1px solid #2c3f53;border-radius:10px;padding:6px 10px;font-size:.8em;color:#708499}
/* spotlight */
.spot{outline:2.5px solid var(--amber);outline-offset:1.5px;box-shadow:0 0 0 5px rgba(255,180,84,.18),0 0 22px rgba(255,180,84,.45);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,180,84,.07),0 0 30px rgba(255,180,84,.6)}}
.spot[data-badge]::after{
  content:attr(data-badge);position:absolute;top:-9px;right:-7px;width:18px;height:18px;border-radius:50%;
  background:var(--amber);color:#241300;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:6;
}
/* annotation */
.an{flex:1;min-width:0;max-width:560px;display:flex;flex-direction:column;gap:14px}
.crumb{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--blue);text-transform:uppercase}
.an h2{font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.12;
  background:linear-gradient(180deg,#fff 30%,#a9d4ff 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.an .body{font-size:15px;line-height:1.62;color:#c6d3e4}
.an .body p{margin:0 0 10px}
.an .body ul{margin:2px 0 10px;padding-left:0;list-style:none}
.an .body li{margin:0 0 7px;padding-left:24px;position:relative}
.an .body li::before{content:"·";position:absolute;left:8px;color:var(--blue);font-weight:900}
.an .body li.n{padding-left:30px}
.an .body li.n::before{content:attr(data-n);left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#241300;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.an .body .em{color:#fff;font-weight:600}
.an .body .mut{color:var(--muted)}
.tip{border:1px solid var(--card-bd);background:linear-gradient(165deg,#13202f,#0f1927);border-radius:14px;padding:12px 15px;font-size:13.5px;line-height:1.55;color:#aebdcd}
.tip b{color:#e8eef7}
/* roles table */
.roles{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.roles th,.roles td{padding:7px 10px;text-align:left;border-bottom:1px solid #1d2c40}
.roles th{color:var(--muted);font-weight:600;font-size:12px}
.roles td:nth-child(2),.roles td:nth-child(3),.roles th:nth-child(2),.roles th:nth-child(3){text-align:center}
/* nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px 14px;
  background:linear-gradient(0deg,rgba(11,18,32,.94),rgba(11,18,32,.7) 75%,transparent)}
.prog{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#7cd0ff);border-radius:3px;transition:width .25s}
.counter{font-size:12.5px;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.nbtn{all:unset;cursor:pointer;width:38px;height:34px;text-align:center;line-height:34px;font-size:17px;color:#cfe0f2;border:1px solid var(--card-bd);border-radius:10px;background:rgba(13,21,34,.7)}
.nbtn:hover{background:rgba(255,255,255,.08)}
.hintkeys{font-size:11px;color:#5d7188}
/* ============ mobile (portrait / narrow) — screen only, never print ============ */
@media screen and (max-width:860px){
  .top{padding:8px 10px;gap:8px;flex-wrap:wrap}
  .brand{font-size:12.5px}
  .brand .txt{max-width:44vw;overflow:hidden;text-overflow:ellipsis}
  .tools{margin-left:auto}
  .tbtn{font-size:11px;padding:5px 8px}
  .chapters{order:5;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
    scrollbar-width:none;-ms-overflow-style:none;padding:2px 0 3px}
  .chapters::-webkit-scrollbar{display:none}
  .chp{flex:0 0 auto;font-size:11px;padding:4px 9px}
  .deck{padding:92px 12px 58px;display:block;overflow:hidden}
  .slide{width:100%;height:100%}
  .slide.on{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 2px 24px}
  .ph{height:auto;width:100%;justify-content:center;flex:0 0 auto}
  .phone{width:min(72vw,300px)}
  .an{max-width:100%;flex:0 0 auto;gap:10px}
  .an h2{font-size:23px}
  .an .body{font-size:14.5px}
  .navbar{padding:8px 12px 10px;gap:10px}
  .hintkeys{display:none}
  .counter{min-width:52px;font-size:11.5px}
}
/* ============ print / PDF ============ */
@media print{
  /* default: desktop 16:9 landscape */
  @page{size:297mm 167mm;margin:0}
  html,body{overflow:visible;background:var(--bg)}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.navbar{display:none!important}
  .deck{position:static;padding:0;display:block}
  .slide{display:flex!important;width:297mm;height:167mm;padding:10mm 14mm;gap:12mm;page-break-after:always;break-after:page;
    flex-direction:row;align-items:center;justify-content:center;overflow:hidden;background:var(--bg)}
  .slide.on{flex-direction:row}
  .ph{height:100%;width:auto;display:flex;align-items:center}
  .phone{width:64mm}
  .an{max-width:none;flex:1}
  .an h2{background:none;-webkit-background-clip:initial;background-clip:initial;color:#eef5ff;-webkit-text-fill-color:#eef5ff}
  .an .body{font-size:13px}
  .tip{font-size:12.5px}
  .spot{animation:none}
  .caret{animation:none}
  /* phone variant: tall portrait page (~20:9), column layout */
  body.pdf-mobile .slide,
  body.pdf-mobile .slide.on{width:120mm;height:260mm;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:7mm 8mm;gap:5mm}
  body.pdf-mobile .ph{height:auto;width:100%;justify-content:center}
  body.pdf-mobile .phone{width:58mm}
  body.pdf-mobile .an{max-width:100%;width:100%;flex:0 1 auto;gap:8px}
  body.pdf-mobile .crumb{font-size:10.5px}
  body.pdf-mobile .an h2{font-size:18px}
  body.pdf-mobile .an .body{font-size:13px;line-height:1.5}
  body.pdf-mobile .an .body p{margin-bottom:7px}
  body.pdf-mobile .an .body li{margin-bottom:5px}
  body.pdf-mobile .tip{font-size:11.5px;padding:9px 12px}
  body.pdf-mobile .roles{font-size:11.5px}
  body.pdf-mobile .roles th,body.pdf-mobile .roles td{padding:5px 7px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><span class="txt" id="brandT">🦷 Doktor Tkalych · skladový bot</span></div>
  <nav class="chapters" id="chapters"></nav>
  <div class="tools">
    <span class="lang">
      <button class="tbtn" id="langCs">CZ</button>
      <button class="tbtn" id="langRu">RU</button>
      <button class="tbtn" id="langEn">EN</button>
    </span>
    <button class="tbtn" id="autoBtn" title="Auto">▶</button>
    <button class="tbtn" id="printBtn">⎙ PDF</button>
  </div>
</header>

<noscript>
  <div style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1220">
    <div style="max-width:440px;text-align:center;font-size:15px;line-height:1.65;color:#c6d3e4">
      <div style="font-size:40px;margin-bottom:10px">🦷</div>
      <b style="color:#fff">Tento prohlížeč nespouští JavaScript.</b><br>
      Otevři stránku v Safari/Chrome, nebo použij PDF verzi.<br><br>
      <b style="color:#fff">Этот просмотрщик не выполняет JavaScript.</b><br>
      Открой страницу в Safari/Chrome или используй PDF-версию.<br><br>
      <b style="color:#fff">This viewer doesn't run JavaScript.</b><br>
      Open the page in Safari/Chrome, or use the PDF version.
    </div>
  </div>
</noscript>
<main class="deck" id="deck"></main>

<footer class="navbar">
  <button class="nbtn" id="prev">‹</button>
  <div class="prog"><i id="progFill"></i></div>
  <span class="counter" id="counter"></span>
  <button class="nbtn" id="next">›</button>
  <span class="hintkeys" id="keysHint">← →</span>
</footer>

<script>
"use strict";
/* ================================================================
   Doktor Tkalych — step-by-step presentation of @wmsdent_bot.
   Bot strings are 1:1 from the bot's i18n locales (cs + ru are the
   live bot's real languages; EN is a faithful translation).
   ================================================================ */
const params = new URLSearchParams(location.search);
const LANGS = ["cs","ru","en"];
let LANG = LANGS.includes(params.get("lang")) ? params.get("lang") : "cs";
const $ = s => document.querySelector(s);
const L = (cs, en, ru) => LANG === "en" ? en : (LANG === "ru" ? (ru !== undefined ? ru : cs) : cs);

/* ?pdf=mobile → tall portrait pages for phone reading (print/PDF only).
   The @page size can't be scoped by a body class, so it's injected here
   as the last stylesheet — later @page wins over the default landscape. */
if (params.get("pdf") === "mobile") {
  document.body.classList.add("pdf-mobile");
  const pg = document.createElement("style");
  pg.textContent = "@media print{@page{size:120mm 260mm;margin:0}}";
  document.head.appendChild(pg);
}

/* ---------- tiny html builders ---------- */
function phone(inner, {input = null, replyBtn = null, inlinePop = null} = {}) {
  const inputHtml = input === false ? "" : `
    <div class="inputbar">${inlinePop || ""}<span class="clip">📎</span>
      <div class="field">${input || `<span class="ph-t">${L("Zpráva","Message","Сообщение")}</span>`}</div>
      <span class="mic">🎤</span></div>`;
  return `<div class="ph"><div class="phone"><div class="notch"></div><div class="screen">
    <div class="status"><span>9:41</span><span class="sicons"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
    <div class="tg-head"><span class="back">‹</span><div class="ava">🦷</div>
      <div class="tg-title"><b>Doktor Tkalych</b><span>@wmsdent_bot</span></div><span class="dots3">⋮</span></div>
    <div class="chat">${inner}</div>
    ${replyBtn ? `<div class="replykb">${replyBtn}</div>` : ""}${inputHtml}
  </div></div></div>`;
}
function scanPhone(inner) { // mini-app scanner screen (the live mini-app is Czech)
  return `<div class="ph"><div class="phone"><div class="notch"></div><div class="screen">
    <div class="status"><span>9:41</span><span class="sicons"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
    <div class="scanhead"><span class="x">${L("Zavřít","Close","Zavřít")}</span><span>@wmsdent_bot</span><span class="dots3">⋮</span></div>
    ${inner}
  </div></div></div>`;
}
const chip = t => `<div class="daychip">${t}</div>`;
const mIn  = (html, extra="") => `<div class="msg in">${html}<span class="t">9:41</span>${extra}</div>`;
const mOut = (html, extra="") => `<div class="msg out">${html}<span class="t">9:41 <span class="tick">✓✓</span></span>${extra}</div>`;
function kb(rows) {
  return `<div class="kb">` + rows.map(r => `<div class="kbrow">` +
    r.map(b => `<span class="kbtn${b.spot?" spot":""}${b.sel?" sel":""}${b.left?" l":""}"${b.badge?` data-badge="${b.badge}"`:""}>${b.t}</span>`).join("") +
    `</div>`).join("") + `</div>`;
}
const money = s => s + " Kč";

/* ---------- screens ---------- */
function mainMenuKb(role, spotKey) {
  const s = S();
  const rows = [[{t:s.menu_stock, spot:spotKey==="stock"}]];
  if (role === "admin") rows.push([{t:s.menu_receive, spot:spotKey==="receive"}]);
  rows.push([{t:s.menu_consume, spot:spotKey==="consume"}]);
  rows.push([{t:s.menu_find, spot:spotKey==="find"}]);
  if (role === "admin") rows.push([{t:s.menu_admin, spot:spotKey==="admin"}]);
  rows.push([{t:s.menu_lang, spot:spotKey==="lang"}]);
  return rows;
}
const homeScreen = (role, spotKey) => phone(chip(S().today) + mIn(S().home + kb(mainMenuKb(role, spotKey))));

function adminMenuScreen(spotKey) {
  return phone(chip(S().today) + mIn(`⚙️ <span class="title">${L("Administrace","Admin panel","Админка")}</span>` + kb([
    [{t:L("📝 Požadavky","📝 Requests","📝 Заявки"), spot:spotKey==="req"}],

    [{t:L("📦 Zboží","📦 Products","📦 Товары"), spot:spotKey==="prods"}],

        <tr><td>📋 Инвентаризация & 🗑 списание</td><td>—</td><td>✅</td></tr>
        <tr><td>📊 Отчёты & 📜 история</td><td>—</td><td>✅</td></tr>
        <tr><td>👥 Пользователи & роли</td><td>—</td><td>✅</td></tr>
       </table>`),
    L("<b>Start ve 3 krocích:</b> ① otevři <b>@wmsdent_bot</b> a pošli /start · ② admin provede inventuru (zavede stavy) · ③ personál začne vydávat. Faktury pak posílej na <b>faktury@tkalych.cz</b>.",
      "<b>Start in 3 steps:</b> ① open <b>@wmsdent_bot</b> and send /start · ② the admin runs a stocktake (opening balances) · ③ the staff starts dispensing. Then route invoices to <b>faktury@tkalych.cz</b>.",
      "<b>Старт в 3 шага:</b> ① открой <b>@wmsdent_bot</b> и отправь /start · ② админ проводит инвентаризацию (заводит остатки) · ③ персонал начинает списывать. Накладные шли на <b>faktury@tkalych.cz</b>."));

  return {F, CH};
}

/* ================================================================
                              ENGINE
   ================================================================ */
let FRAMES = [], CHAPTERS = [], cur = 0, auto = null;

function renderAll() {
  const {F, CH} = buildFrames();
  FRAMES = F; CHAPTERS = CH;
  document.documentElement.lang = LANG;
  $("#brandT").textContent = L("🦷 Doktor Tkalych · skladový bot","🦷 Doktor Tkalych · inventory bot","🦷 Doktor Tkalych · складской бот");
  document.title = L("🦷 Doktor Tkalych — skladový bot · prezentace","🦷 Doktor Tkalych — inventory bot · presentation","🦷 Doktor Tkalych — складской бот · презентация");
  const chN = $("#chapters"); chN.innerHTML = "";
  CH.forEach((name, i) => {
    const first = F.findIndex(f => f.ch === i);
    if (first < 0) return;
    const b = document.createElement("button");
    b.className = "chp"; b.dataset.ch = i;
    b.textContent = `${i+1}. ${name}`;
    b.onclick = () => show(first);
    chN.appendChild(b);
  });
  const deck = $("#deck"); deck.innerHTML = "";
  F.forEach((f, i) => {
    const stepInCh = F.slice(0, i).filter(x => x.ch === f.ch).length + 1;
    const chTotal = F.filter(x => x.ch === f.ch).length;
    const sec = document.createElement("section");
    sec.className = "slide"; sec.dataset.i = i;
    sec.innerHTML = f.phoneHtml + `<aside class="an">
        <div class="crumb">${L("Kapitola","Chapter","Глава")} ${f.ch+1} · ${CH[f.ch]} · ${L("krok","step","шаг")} ${stepInCh}/${chTotal}</div>
        <h2>${f.title}</h2>
        <div class="body">${f.bodyHtml}</div>
        ${f.tip ? `<div class="tip">💡 ${f.tip}</div>` : ""}
      </aside>`;
    deck.appendChild(sec);
  });
  $("#keysHint").textContent = L("listuj ← →","← → keys","листай ← →");
  $("#langCs").classList.toggle("on", LANG==="cs");
  $("#langRu").classList.toggle("on", LANG==="ru");
  $("#langEn").classList.toggle("on", LANG==="en");
  show(Math.min(cur, FRAMES.length - 1));
}

function show(i) {
  cur = Math.max(0, Math.min(i, FRAMES.length - 1));
  document.querySelectorAll(".slide").forEach((s, k) => {
    s.classList.toggle("on", k === cur);
    if (k === cur) s.scrollTop = 0;
  });
  document.querySelectorAll(".chp").forEach(b => {
    const on = +b.dataset.ch === FRAMES[cur].ch;
    b.classList.toggle("on", on);
    if (on && b.scrollIntoView) b.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  $("#counter").textContent = `${cur+1} / ${FRAMES.length}`;
  $("#progFill").style.width = ((cur+1) / FRAMES.length * 100) + "%";
  try { history.replaceState(null, "", `?lang=${LANG}#${cur+1}`); } catch (e) {}
}
function setLang(l) { if (LANG !== l) { LANG = l; renderAll(); } }

$("#prev").onclick = () => show(cur - 1);
$("#next").onclick = () => show(cur + 1);
$("#printBtn").onclick = () => window.print();
$("#langCs").onclick = () => setLang("cs");
$("#langRu").onclick = () => setLang("ru");
$("#langEn").onclick = () => setLang("en");
$("#autoBtn").onclick = () => {
  if (auto) { clearInterval(auto); auto = null; $("#autoBtn").classList.remove("on"); }
  else { auto = setInterval(() => show(cur + 1 >= FRAMES.length ? 0 : cur + 1), 7000); $("#autoBtn").classList.add("on"); }
};
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(cur + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(FRAMES.length - 1);
});
/* swipe navigation (mobile) */
let swX = 0, swY = 0;
const deckEl = $("#deck");
deckEl.addEventListener("touchstart", e => { swX = e.touches[0].clientX; swY = e.touches[0].clientY; }, {passive:true});
deckEl.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - swX, dy = e.changedTouches[0].clientY - swY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.6 * Math.abs(dy)) { dx < 0 ? show(cur + 1) : show(cur - 1); }
}, {passive:true});

const initHash = parseInt((location.hash || "").slice(1), 10);
renderAll();
if (initHash >= 1) show(initHash - 1);
</script>
</body>
</html>
